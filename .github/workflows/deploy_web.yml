name: Deploy game.noodable.com

on:
  push:
    branches:
      - rogue-choices/prod
      - rogue-choices/staging
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to game.noodable.com
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_BRANCH: ${{ github.ref_name }}
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          script_stop: true
          envs: DEPLOY_BRANCH
          script: |
            set -euo pipefail
            cd /home/deploy/game.noodable.com/repo
            ./tool/deploy_web.sh "$DEPLOY_BRANCH"
