services:
  flutter:
    build:
      context: .
      dockerfile: docker/flutter/Dockerfile
    working_dir: /workspace/pixelgridOS
    volumes:
      - .:/workspace/pixelgridOS
      - flutter_pub_cache:/root/.pub-cache
    environment:
      # Browser code runs on your host, so localhost must point at the exposed Pi bridge port.
      PI_API_URL: http://localhost:8787
      PI_BRIDGE_TOKEN: ${PI_BRIDGE_TOKEN:-}
    ports:
      - "8080:8080"
    depends_on:
      - pi

  pi:
    build:
      context: .
      dockerfile: docker/pi-bridge/Dockerfile
    working_dir: /workspace/pixelgridOS
    volumes:
      - .:/workspace/pixelgridOS
      - pi_home:/root/.pi
      - pi_sessions:/pi-sessions
    environment:
      PI_WORKSPACE: /workspace/pixelgridOS
      PI_SESSION_DIR: /pi-sessions
      # Optional; set these in your shell or a .env file before `docker compose up`.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      PI_PROVIDER: ${PI_PROVIDER:-}
      PI_MODEL: ${PI_MODEL:-}
      PI_BRIDGE_TOKEN: ${PI_BRIDGE_TOKEN:-}
    ports:
      - "8787:8787"

volumes:
  flutter_pub_cache:
  pi_home:
  pi_sessions:
